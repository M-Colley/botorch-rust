name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }}, ${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Diagnostic: Linux parity equivalence only, not the complete CI matrix.
          - os: ubuntu-latest
            python-version: "3.12"
            label: BoTorch parity
            packages: numpy pymoo
            parity: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up the Rust toolchain (rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: ""
      - name: Install CPU-only torch
        if: matrix.parity || contains(matrix.packages, 'torch') || contains(matrix.packages, 'botorch')
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install test dependencies
        shell: bash
        run: python -m pip install pytest ${{ matrix.packages }}
      - name: Check out the pinned official BoTorch reference
        if: matrix.parity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: meta-pytorch/botorch
          ref: b0dd01be61d517c387e234903a6e2cc38c057ea2
          path: .reference/botorch
          persist-credentials: false
      - name: Install the pinned reference and optional trace dependencies
        if: matrix.parity
        run: python -m pip install "./.reference/botorch[fully_bayesian]"
      - name: Build and install botorch-rust (maturin)
        run: python -m pip install -v ./botorch_pyo3
      - name: Show versions
        shell: bash
        run: |
          python -c "import botorch_rs; print('botorch_rs', botorch_rs.__version__, botorch_rs.__file__)"
          if [ "${{ matrix.parity }}" = "true" ]; then
            python -c "import botorch, gpytorch, torch; print('botorch', botorch.__version__, 'gpytorch', gpytorch.__version__, 'torch', torch.__version__)"
          fi
      - name: Strict pinned core API inventory
        if: matrix.parity
        run: python scripts/api_coverage.py --require-full --out api-coverage-ci.md --json-out api-coverage-ci.json
      # The unified equivalence suite against live BoTorch (a few minutes); its
      # terminal summary lists the worst error of every compared quantity.
      - name: Equivalence suite (BoTorch)
        if: matrix.parity
        working-directory: botorch_pyo3
        env:
          BOTORCH_RS_REQUIRE_BOTORCH: "1"
        run: python -m pytest tests -q -rs -m equivalence
