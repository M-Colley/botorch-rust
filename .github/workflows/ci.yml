name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # PyO3's build configuration (botorch_pyo3) needs a Python interpreter.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up the Rust toolchain (rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt, clippy
          rustflags: ""
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests (unit, BoTorch parity fixtures, doctests)
        run: cargo test --workspace --locked

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ruff and mypy
        run: python -m pip install ruff mypy
      - name: ruff
        run: |
          ruff check --config botorch_pyo3/pyproject.toml botorch_pyo3/python botorch_pyo3/tests scripts/develop.py scripts/benchmark.py scripts/plot_benchmarks.py scripts/api_coverage.py scripts/benchmark_mo_utils.py scripts/fixtures_mo_test_functions.py scripts/benchmark_arrays.py scripts/fixtures_mo_acquisition.py scripts/fixtures_mo_robust.py scripts/fixtures_mo_hvkg.py scripts/benchmark_mo_hvkg.py
          ruff format --check --config botorch_pyo3/pyproject.toml botorch_pyo3/python botorch_pyo3/tests scripts/develop.py scripts/benchmark.py scripts/plot_benchmarks.py scripts/api_coverage.py scripts/benchmark_mo_utils.py scripts/fixtures_mo_test_functions.py scripts/benchmark_arrays.py scripts/fixtures_mo_acquisition.py scripts/fixtures_mo_robust.py scripts/fixtures_mo_hvkg.py scripts/benchmark_mo_hvkg.py
      - name: mypy
        working-directory: botorch_pyo3
        run: mypy python/botorch_rs

  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }}, ${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # No optional packages: nested lists only.
          - os: ubuntu-latest
            python-version: "3.11"
            label: lists
            packages: ""
          - os: ubuntu-latest
            python-version: "3.13"
            label: numpy + torch
            packages: numpy torch
          - os: windows-latest
            python-version: "3.12"
            label: numpy
            packages: numpy
          - os: macos-latest
            python-version: "3.13"
            label: numpy
            packages: numpy
          # Parity tests against the released BoTorch.
          - os: ubuntu-latest
            python-version: "3.12"
            label: BoTorch parity
            packages: botorch numpy pymoo
            parity: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up the Rust toolchain (rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: ""
      - name: Install CPU-only torch
        if: contains(matrix.packages, 'torch') || contains(matrix.packages, 'botorch')
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install test dependencies
        shell: bash
        run: python -m pip install pytest ${{ matrix.packages }}
      - name: Build and install botorch-rust (maturin)
        run: python -m pip install -v ./botorch_pyo3
      - name: Show versions
        shell: bash
        run: |
          python -c "import botorch_rs; print('botorch_rs', botorch_rs.__version__, botorch_rs.__file__)"
          if [ "${{ matrix.parity }}" = "true" ]; then
            python -c "import botorch, gpytorch, torch; print('botorch', botorch.__version__, 'gpytorch', gpytorch.__version__, 'torch', torch.__version__)"
          fi
      - name: Tests
        working-directory: botorch_pyo3
        env:
          # The parity entry must run (not skip) the BoTorch comparisons.
          BOTORCH_RS_REQUIRE_BOTORCH: ${{ matrix.parity && '1' || '' }}
        run: python -m pytest tests -q -rs -m "not equivalence"
      # The unified equivalence suite against live BoTorch (a few minutes); its
      # terminal summary lists the worst error of every compared quantity.
      - name: Equivalence suite (BoTorch)
        if: matrix.parity
        working-directory: botorch_pyo3
        env:
          BOTORCH_RS_REQUIRE_BOTORCH: "1"
        run: python -m pytest tests -q -rs -m equivalence
