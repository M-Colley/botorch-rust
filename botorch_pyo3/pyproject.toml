[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "botorch-rust"
version = "0.3.1rc1"
description = "A fast Rust implementation of BoTorch with the same Python API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "The botorch-rust authors" }]
keywords = ["bayesian-optimization", "gaussian-process", "botorch", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# No runtime dependencies: torch tensors and NumPy arrays are supported when
# those libraries are installed, nested lists of floats always.
dependencies = []

[project.optional-dependencies]
torch = ["torch"]
# Tensor-facing continuous FPBI uses a CPU SciPy solver. Native list/NumPy
# FPBI continues to use Rust without these dependencies.
decision = ["torch", "numpy", "scipy"]
test = ["pytest>=8"]
# The parity tests compare against BoTorch (and use torch, GPyTorch, NumPy).
parity = ["pytest>=8", "botorch", "numpy"]

[project.urls]
repository = "https://github.com/M-Colley/botorch-rust"
botorch = "https://botorch.org"

[tool.maturin]
module-name = "botorch_rs._botorch_rs"
python-source = "python"
manifest-path = "Cargo.toml"
features = ["pyo3/extension-module"]
# Distribute source, without generated interpreter-specific bytecode caches.
exclude = ["**/__pycache__/**", "**/*.pyc", "**/*.pyo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "equivalence: the unified randomized equivalence suite against live BoTorch (select with `-m equivalence`)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["botorch_rs", "helpers", "parity_helpers"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
